[package]
name = "turbovec-ffi"
version = "0.1.0"
edition = "2021"
authors = ["AMU-QUANT Project"]
description = "C-ABI Foreign Function Interface for turbovec TurboQuant Vector Quantization"
license = "MIT OR Apache-2.0"

[lib]
name = "turbovec_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Dependensi turbovec core atau implementasi embedded TurboQuant
# turbovec = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
